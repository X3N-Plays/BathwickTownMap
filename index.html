<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bathwick Town Map</title>
    <style>
        /* Basic styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        #map {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .map-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .map-layer.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="map">
        <img id="roads" src="Roads.png" class="map-layer">
        <img id="locations" src="Locations.png" class="map-layer">
    </div>

    <script>
        // Function to toggle visibility of map layers
        function toggleLayer(layerId) {
            const layer = document.getElementById(layerId);
            if (layer.classList.contains('visible')) {
                layer.classList.remove('visible');
            } else {
                layer.classList.add('visible');
            }
        }

        // Example of toggling layers (you can customize this based on buttons or other triggers)
        document.getElementById('roads').classList.add('visible');
        document.getElementById('locations').classList.add('visible');
    </script>
</body>
</html>
